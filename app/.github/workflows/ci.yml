name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './app/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./app
      run: npm ci
      
    - name: Check types
      working-directory: ./app
      run: npm run check
      
    - name: Lint
      working-directory: ./app
      run: npm run lint
      
    - name: Run Tests
      working-directory: ./app
      run: npm run test -- --run
      
    - name: Build
      working-directory: ./app
      run: npm run build
